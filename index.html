<!DOCTYPE html>

<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPRIGHT 365</title>

<style>

/* =========================
   1. RESET
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
width:100%;
overflow-x:hidden;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:linear-gradient(
180deg,
#EAF8FF 0%,
#D7F2FF 15%,
#C6E8FF 35%,
#F4FAFF 65%,
#FFFFFF 100%
);
background-attachment:fixed;
color:#0F172A;
width:100%;
overflow-x:hidden;
word-break:keep-all;
}

/* =========================
   2. 공통 레이아웃
========================= */

section{
padding:80px 24px;
}

.container{
max-width:1100px;
width:100%;
margin:auto;
}

.card{
width:100%;
background:rgba(255,255,255,.92);
backdrop-filter:blur(24px);
border-radius:40px;
padding:60px;
box-shadow:
0 30px 80px rgba(15,23,42,.08),
0 10px 30px rgba(20,184,166,.08);
}

.section-title{
font-size:52px;
font-weight:800;
margin-bottom:12px;
}

.section-line{
width:80px;
height:5px;
border-radius:999px;
margin-bottom:30px;
}

.score-line{background:#14B8A6;}
.law-line{background:#2563EB;}
.check-line{background:#F59E0B;}
.value-line{background:#8B5CF6;}

/* =========================
   3. HERO
========================= */

.hero{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:60px 24px;
position:relative;
overflow:hidden;
}

.hero::before{
content:"";
position:absolute;
width:500px;
height:500px;
background:
radial-gradient(
circle,
rgba(20,180,193,.18),
transparent 70%
);
top:-180px;
left:50%;
transform:translateX(-50%);
filter:blur(30px);
pointer-events:none;
}

.hero-content{
max-width:1000px;
width:100%;
position:relative;
z-index:1;
}

.brand{
font-size:30px;
font-weight:800;
letter-spacing:8px;
color:#14B4C1;
margin-bottom:20px;
}

.date{
font-size:30px;
font-weight:600;
color:#94A3B8;
margin-bottom:20px;
}

.hero-title{
font-size:50px;
font-weight:800;
color:#94A3B8;
margin-bottom:30px;
}

.quote{
font-size:clamp(32px,6vw,80px);
font-weight:800;
line-height:1.5;
max-width:900px;
margin:auto;
overflow-wrap:break-word;
}

.tag{
margin-top:24px;
font-size:22px;
font-weight:700;
color:#14B4C1;
}

/* =========================
4. 오늘의 청렴지수
========================= */

.score-card{
text-align:center;
}

.score-layout{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
gap:12px;
}

.weather{
font-size:80px;
line-height:1;
margin-bottom:8px;
}

.score{
font-size:100px;
font-weight:900;
line-height:1;
letter-spacing:-4px;
color:#14B8A6;
}

.status{
font-size:40px;
font-weight:800;
color:#0F172A;
margin-top:4px;
}

.tip{
margin-top:12px;
font-size:24px;
line-height:1.8;
color:#64748B;
max-width:700px;
}

/* =========================
5. 관련 법령
========================= */

.law-card{
text-align:center;
}

.law-icon{
font-size:50px;
margin-bottom:15px;
}

.law-title{
font-size:42px;
font-weight:800;
margin-bottom:15px;
}

.law-desc{
font-size:24px;
line-height:1.8;
color:#64748B;
}

.law-btn{
display:inline-block;
margin-top:30px;
padding:16px 32px;
border-radius:16px;
text-decoration:none;
font-weight:700;
color:#fff;
background:
linear-gradient(
135deg,
#2563EB,
#3B82F6
);
transition:.2s;
}

.law-btn:hover{
transform:translateY(-2px);
box-shadow:
0 10px 30px rgba(37,99,235,.25);
}

/* =========================
6. 청렴 체크리스트
========================= */

.checklist-card{
padding:20px 40px;
}

.check-row{
display:flex;
align-items:center;
gap:18px;
padding:24px 0;
font-size:24px;
font-weight:600;
border-bottom:1px solid #E5E7EB;
cursor:pointer;
transition:.2s;
}

.check-row:hover{
transform:translateX(6px);
}

.check-row:last-of-type{
border-bottom:none;
}

.check-row input{
width:28px;
height:28px;
accent-color:#F59E0B;
cursor:pointer;
flex-shrink:0;
}

.check-row span{
line-height:1.6;
}

.check-result{
margin-top:30px;
padding:20px;
border-radius:18px;
background:#FFF7ED;
color:#C2410C;
font-size:18px;
font-weight:700;
text-align:center;
}

/* =========================
7. 청렴이 만드는 가치
========================= */

.value-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:24px;
}

.value-card{
background:#fff;
padding:36px;
border-radius:28px;
text-align:center;
box-shadow:
0 15px 40px rgba(0,0,0,.06);
transition:.3s;
}

.value-card:hover{
transform:translateY(-8px);
}

.value-card:nth-child(1){
border-top:6px solid #2563EB;
}

.value-card:nth-child(2){
border-top:6px solid #14B8A6;
}

.value-card:nth-child(3){
border-top:6px solid #8B5CF6;
}

.value-icon{
font-size:54px;
margin-bottom:15px;
}

.value-title{
font-size:28px;
font-weight:800;
margin-bottom:12px;
}

.value-desc{
line-height:1.8;
color:#64748B;
}

/* =========================
8. FOOTER
========================= */

.footer{
margin-top:80px;
padding:120px 24px;
text-align:center;
color:#fff;
background:
linear-gradient(
135deg,
#14B4C1,
#5A86C7
);
}

.footer-title{
font-size:42px;
font-weight:800;
margin-bottom:15px;
}

.footer-desc{
font-size:20px;
margin-bottom:15px;
}
