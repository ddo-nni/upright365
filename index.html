<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPRIGHT 365</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:linear-gradient(
180deg,
#EAF8FF 0%,
#D7F2FF 15%,
#C6E8FF 35%,
#F4FAFF 65%,
#FFFFFF 100%
);
background-attachment:fixed;
color:#0F172A;
overflow-x:hidden;
word-break:keep-all;
}

.hero{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:60px 24px;
}

.hero-content{
max-width:1000px;
}

.brand{
font-size:20px;
font-weight:800;
letter-spacing:8px;
color:#14B4C1;
margin-bottom:20px;
}

.date{
font-size:22px;
font-weight:600;
color:#94A3B8;
margin-bottom:20px;
}

.hero-title{
font-size:52px;
font-weight:800;
color:#94A3B8;
margin-bottom:30px;
}

.quote{
font-size:clamp(40px,6vw,80px);
font-weight:800;
line-height:1.5;
}

.tag{
margin-top:24px;
font-size:22px;
font-weight:700;
color:#14B4C1;
}

section{
padding:80px 24px;
}

.container{
max-width:1100px;
margin:auto;
}

.section-title{
font-size:52px;
font-weight:800;
margin-bottom:12px;
}

.section-line{
width:80px;
height:5px;
border-radius:999px;
margin-bottom:30px;
}

.card{
background:rgba(255,255,255,.82);
backdrop-filter:blur(18px);
border-radius:36px;
padding:48px;
box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.score-line{
background:#14B8A6;
}

.law-line{
background:#2563EB;
}

.value-line{
background:#8B5CF6;
}

.score-card{
text-align:center;
}

.score-circle{
width:260px;
height:260px;
border-radius:50%;
margin:30px auto;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(
135deg,
#F8FFFF,
#DFFCF8
);
box-shadow:0 25px 50px rgba(20,184,166,.15);
}

.weather{
font-size:58px;
}

.score{
font-size:78px;
font-weight:800;
}

.status{
font-size:26px;
font-weight:700;
color:#14B8A6;
}

.tip{
margin-top:30px;
font-size:22px;
line-height:1.8;
color:#64748B;
}

.law-card{
text-align:center;
}

.law-icon{
font-size:56px;
margin-bottom:15px;
}

.law-title{
font-size:34px;
font-weight:800;
margin-bottom:15px;
}

.law-desc{
font-size:18px;
color:#64748B;
line-height:1.8;
}

.law-btn{
display:inline-block;
margin-top:30px;
padding:16px 32px;
border-radius:16px;
text-decoration:none;
color:white;
font-weight:700;
background:linear-gradient(
135deg,
#2563EB,
#3B82F6
);
}

.value-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:24px;
}

.value-card{
background:white;
padding:36px;
border-radius:28px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.06);
}

.value-icon{
font-size:54px;
margin-bottom:15px;
}

.value-title{
font-size:28px;
font-weight:800;
margin-bottom:12px;
}

.value-desc{
line-height:1.8;
color:#64748B;
}

.footer{
margin-top:80px;
padding:120px 24px;
text-align:center;
color:white;
background:linear-gradient(
135deg,
#14B4C1,
#5A86C7
);
}

.footer-title{
font-size:42px;
font-weight:800;
margin-bottom:15px;
}

.footer-desc{
font-size:20px;
margin-bottom:15px;
}

@media(max-width:900px){

.hero-title{
font-size:34px;
}

.quote{
font-size:42px;
}

.section-title{
font-size:34px;
}

.value-grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<section class="hero">

<div class="hero-content">

<div class="brand">
UPRIGHT 365
</div>

<div class="date" id="date"></div>

<div class="hero-title">
오늘의 청렴 한마디
</div>

<div class="quote" id="quote"></div>

<div class="tag" id="tag"></div>

</div>

</section>

<section>

<div class="container">

<h2 class="section-title">
오늘의 청렴지수
</h2>

<div class="section-line score-line"></div>

<div class="card score-card">

<div class="score-circle">

<div class="weather" id="weather"></div>

<div class="score" id="score"></div>

<div class="status" id="status"></div>

</div>

<div class="tip" id="tip"></div>

</div>

</div>

</section>

<section>

<div class="container">

<h2 class="section-title">
관련 법령
</h2>

<div class="section-line law-line"></div>

<div class="card law-card">

<div class="law-icon">📖</div>

<div class="law-title" id="law"></div>

<div class="law-desc">
오늘의 청렴 메시지와 연계된 주요 법령입니다.
</div>

<a
id="lawLink"
class="law-btn"
href="https://www.law.go.kr"
target="_blank">

법령 전문 보기

</a>

</div>

</div>

</section>

<section>

<div class="container">

<h2 class="section-title">
청렴이 만드는 가치
</h2>

<div class="section-line value-line"></div>

<div class="value-grid">

<div class="value-card">
<div class="value-icon">✈️</div>
<div class="value-title">안전</div>
<div class="value-desc">
신뢰받는 공항 운영은 청렴한 업무수행으로부터 시작됩니다.
</div>
</div>

<div class="value-card">
<div class="value-icon">🛡️</div>
<div class="value-title">투명</div>
<div class="value-desc">
모든 의사결정은 공정하고 투명하게 이루어져야 합니다.
</div>
</div>

<div class="value-card">
<div class="value-icon">🤝</div>
<div class="value-title">상생</div>
<div class="value-desc">
이해관계자와의 신뢰는 청렴한 조직문화에서 만들어집니다.
</div>
</div>

</div>

</div>

</section>

<footer class="footer">

<div class="footer-title">
UPRIGHT 365
</div>

<div class="footer-desc">
매일의 청렴이 신뢰를 만듭니다.
</div>

<div>
인천공항시설관리
</div>

</footer>

<script>

const items=[

{
quote:"사소한 편의 제공도 이해충돌의 시작이 될 수 있습니다.",
tag:"#이해충돌",
law:"이해충돌방지법 제5조",
score:92,
emoji:"🌤️",
status:"맑음",
tip:"오늘은 이해충돌 여부를 한 번 더 점검해보는 건 어떨까요?"
},

{
quote:"업무상 알게 된 정보를 개인적 이익에 활용할 수 없습니다.",
tag:"#정보보호",
law:"임직원 행동강령",
score:84,
emoji:"⛅",
status:"보통",
tip:"오늘은 업무정보 관리 상태를 확인해보세요."
}

];

const today=new Date();

document.getElementById("date").innerText=
today.toLocaleDateString("ko-KR",{
year:"numeric",
month:"long",
day:"numeric",
weekday:"long"
});

const item=
items[
Math.floor(
(today-new Date(today.getFullYear(),0,0))
/86400000
)%items.length
];

quote.innerText="“"+item.quote+"”";
tag.innerText=item.tag;
law.innerText=item.law;
score.innerText=item.score;
weather.innerText=item.emoji;
status.innerText=item.status;
tip.innerText=item.tip;

</script>

</body>
</html>
