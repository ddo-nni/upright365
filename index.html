<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 청렴 한마디</title>

<style>
body{
    margin:0;
    font-family:Pretendard,sans-serif;
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:90%;
    max-width:400px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 8px 30px rgba(0,0,0,.1);
    text-align:center;
}

.date{
    color:#666;
    margin-bottom:20px;
}

.quote{
    font-size:22px;
    font-weight:700;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="card">
    <div class="date" id="date"></div>
    <div class="quote" id="quote"></div>
</div>

<script>

const quotes = [
"사소한 편의 제공도 이해충돌의 시작이 될 수 있습니다.",
"업무상 알게 된 정보를 개인적 이익에 활용할 수 없습니다.",
"청렴은 누군가 보고 있을 때가 아니라 보지 않을 때 지켜집니다.",
"공정한 업무수행이 조직의 신뢰를 만듭니다.",
"규정 준수는 청렴의 기본입니다."
];

const today = new Date();

document.getElementById('date').innerText =
today.toLocaleDateString('ko-KR');

const dayOfYear =
Math.floor(
(today - new Date(today.getFullYear(),0,0))
/ 86400000
);

document.getElementById('quote').innerText =
quotes[dayOfYear % quotes.length];

</script>

</body>
</html>
