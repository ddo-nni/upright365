justify-content:center;

.hero-content{
max-width:1000px;
}

.brand{
font-size:20px;
letter-spacing:8px;
font-weight:800;
color:#14B4C1;
margin-bottom:40px;
text-transform:uppercase;
}

.date{
font-size:22px;
font-weight:600;
color:#94A3B8;
margin-bottom:15px;
}

.hero-title{
font-size:52px;
font-weight:800;
color:#94A3B8;
margin-bottom:30px;
}

.quote{
font-size:clamp(40px,6vw,80px);
font-weight:800;
line-height:1.5;
}

.tag{
margin-top:24px;
font-size:22px;
font-weight:700;
color:#14B4C1;
}

section{
padding:90px 24px;
}

.container{
max-width:1100px;
margin:auto;
}

.card{
background:rgba(255,255,255,.82);
backdrop-filter:blur(18px);
border-radius:36px;
padding:48px;
box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.section-title{
font-size:52px;
font-weight:800;
color:#0F172A;
margin-bottom:12px;
}

.section-line{
width:80px;
height:5px;
border-radius:999px;
margin-bottom:30px;
}

.score-line{
background:#14B8A6;
}

.score-card{
text-align:center;
}

.score-circle{
width:260px;
height:260px;
border-radius:50%;

margin:30px auto;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:
linear-gradient(
135deg,
#F8FFFF,
#DFFCF8
);

box-shadow:
0 25px 50px rgba(20,184,166,.15);
}

.weather{
font-size:58px;
margin-bottom:10px;
}

.score{
font-size:78px;
font-weight:800;
line-height:1;
}

.status{
font-size:28px;
font-weight:700;
margin-top:12px;
color:#14B8A6;
}

.tip{
margin-top:35px;
font-size:22px;
line-height:1.8;
color:#64748B;
max-width:700px;
margin-left:auto;
margin-right:auto;
}

.law-line{
background:#2563EB;
}

.law-card{
text-align:center;
}

.law-icon{
font-size:60px;
margin-bottom:15px;

.law-title{
font-size:36px;
font-weight:800;
margin-bottom:15px;
}

.law-desc{
font-size:18px;
line-height:1.8;
color:#64748B;
}

.law-btn{

margin-top:30px;

padding:16px 32px;

background:
linear-gradient(
135deg,
#2563EB,
#3B82F6
);

color:white;
font-weight:700;
text-decoration:none;

border-radius:16px;
}

.value-line{
background:#8B5CF6;
}

.value-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:24px;
}

background:white;
padding:36px;
border-radius:28px;
text-align:center;

box-shadow:
0 15px 40px rgba(0,0,0,.06);
}

}

.value-card:nth-child(2){

}

.value-card:nth-child(3){

font-size:58px;
margin-bottom:15px;

.value-title{
font-size:30px;
font-weight:800;

.value-desc{

}
);

);
